name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      chemlib_jar_url:
        description: 'Direct download URL for the matching Minecraft 26.2 ChemLib JAR'
        required: true
        type: string

jobs:
  build:
    # The companion ChemLib port is not yet published to Maven.
    if: github.event_name == 'workflow_dispatch' || vars.CHEMLIB_26_2_JAR_URL != ''
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download matching ChemLib
        shell: bash
        env:
          CHEMLIB_JAR_URL: ${{ inputs.chemlib_jar_url || vars.CHEMLIB_26_2_JAR_URL }}
        run: |
          mkdir -p build/dependencies
          curl --fail --location --retry 3 "$CHEMLIB_JAR_URL" --output build/dependencies/ChemLib.jar
      - name: Build and run server tests
        shell: bash
        run: bash gradlew -Pchemlib_jar=build/dependencies/ChemLib.jar build runGameTest
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Alchemistry-26.2
          path: build/libs/
